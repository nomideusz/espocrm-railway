# Quiets "Could not reliably determine the server's fully qualified domain name".
ServerName localhost

# Client IPs from Railway's edge, so login throttling counts per visitor
# rather than per edge node.
RemoteIPHeader X-Real-IP
RemoteIPInternalProxy 100.64.0.0/10

# The WebSocket server (live notifications and stream updates). Espo's client
# connects to wss://<site>/wss when the site URL is https.
ProxyPass /wss ws://127.0.0.1:8080/
